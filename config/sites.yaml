        url: /alimentacao-saudavel
        termos: [saudavel, saudável, fit, proteina, proteína, dieta, nutricao, nutrição, vegano, vegetariano, integral]

    fontes:
      - tipo: google_news
        consulta: "receitas para marmitas congeladas"
      - tipo: google_news
        consulta: "receitas para marmitas congeladas"

    publicacao:
      radar: rascunho        # noticia de terceiro: sempre revisao humana

