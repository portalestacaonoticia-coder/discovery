# Um bloco por site. Adicionar site novo = adicionar bloco aqui, nada de codigo.
# Todo campo aqui vira comportamento do radar: fontes, hubs, angulos e permissao de publicar.

sites:

  ferrugem:
    dominio: ferrugem.com.br
    entidade: "Ferrugem (cantor)"          # como o site quer ser entendido por buscador e IA
    idioma: pt-BR
    fuso: America/Sao_Paulo

    # Hubs = paginas permanentes. Toda pauta e' classificada em um deles.
    # 'termos' alimenta o classificador por palavra-chave (modo sem LLM).
    # 'imagem: false' em TODOS os hubs: este site fala de um cidadao vivo.
    # Foto de acervo ao lado do nome dele sugere que e' ele — e nao e'. Aqui
    # a imagem destacada so' entra com foto licenciada do proprio artista.
    hubs:
      - id: agenda
        titulo: "Agenda de shows do Ferrugem"
        url: /agenda-de-shows
        termos: [show, shows, turne, turnê, ingresso, ingressos, apresentacao, apresentação, festival, palco]
        imagem: false
      - id: perfil
        titulo: "Quem e Ferrugem"
        url: /quem-e-ferrugem
        termos: [biografia, historia, história, carreira, entrevista, familia, família]
        imagem: false
      - id: musicas
        titulo: "Discografia e lancamentos"
        url: /discografia
        termos: [album, álbum, single, lancamento, lançamento, clipe, dvd, ep, feat, parceria]
        imagem: false
      - id: premios
        titulo: "Premios e indicacoes"
        url: /premios
        termos: [premio, prêmio, grammy, multishow, indicacao, indicação, trofeu, troféu]
        imagem: false

    # Sobrescreve o molde de titulo de um angulo so' para este site.
    moldes:
      servico: "{fato}: horario, ingressos e como chegar"

    fontes:
      - tipo: google_news
        consulta: "Ferrugem cantor"
      - tipo: google_news
        consulta: "Ferrugem pagode show"
      # sitemap de noticias de concorrente: radar mais rapido que existe, e' publico e
      # atualiza em segundos. So' leitura de titulo/URL — nada de copiar texto.
      # - tipo: sitemap_news
      #   url: https://exemplo-portal.com.br/sitemap-news.xml

    # Base propria: e' o que transforma "reescrever noticia" em "noticia nova".
    # Aqui, o historico de shows — origem do angulo "quantas vezes ele ja tocou na cidade".
    base: eventos

    # Permissao de publicar sozinho, por tipo de pauta. Ver README, secao "Portoes".
    publicacao:
      calendario: auto       # fato com data marcada + dado da base propria
      radar: rascunho        # pauta vinda de noticia de terceiro: sempre revisao humana

  doll:
    dominio: doll.com.br
    entidade: "Doll — Dolar e Cambio"      # o dominio nao diz 'dolar': a entidade precisa dizer
    idioma: pt-BR
    fuso: America/Sao_Paulo

    hubs:
      # 'imagem' = termo de busca no banco de imagens (radar/imagens.py).
      # Em INGLES de proposito: e' o idioma em que os acervos livres estao
      # catalogados, entao rende muito mais resultado no tamanho do Discover.
      - id: cotacao
        titulo: "Cotacao do dolar hoje"
        url: /cotacao-do-dolar
        termos: [dolar, dólar, cotacao, cotação, ptax, cambio, câmbio, moeda]
        imagem: "us dollar bills currency"
      - id: politica-monetaria
        titulo: "Como Fed e Copom mexem no dolar"
        url: /fed-copom-dolar
        termos: [fed, fomc, copom, juros, selic, ata, powell, banco central]
        imagem: "central bank building finance"
      - id: viagem
        titulo: "Dolar para viagem: turismo, cartao e IOF"
        url: /dolar-viagem
        termos: [viagem, turismo, iof, cartao, cartão, remessa, exterior, casa de cambio]
        imagem: "travel passport money airport"
      - id: indicadores
        titulo: "Indicadores que movem o dolar"
        url: /indicadores
        termos: [ipca, cpi, payroll, pib, inflacao, inflação, focus, balanca, balança]
        imagem: "financial charts economic data"

    # Aliquotas usadas nas tabelas de conversao. CONFERIR na Receita/decreto antes
    # de publicar: IOF muda por decreto e o numero errado sai em toda materia.
    iof:
      cartao_credito: 3.50
      especie: 3.50

    moldes:
      servico: "{fato}: quanto custa e o que fazer agora"
      contagem: "{fato}: {dado_curto}"

    fontes:
      - tipo: google_news
        consulta: "dolar cotacao Banco Central"
      - tipo: google_news
        consulta: "dolar hoje cambio real"

    base: cotacoes

    # Senha de aplicativo do WordPress (Usuarios -> Perfil -> Senhas de aplicativo).
    # O valor fica no .env; aqui vai so' o NOME da variavel.
    wordpress:
      url: https://doll.com.br
      usuario_env: WP_DOLL_USUARIO
      senha_env: WP_DOLL_SENHA
      categoria_por_hub: true

      # Usado uma vez, por `python -m radar.configurar_wp --site doll`.
      # Site novo: copiar este bloco, trocar os textos, rodar. Nada manual.
      configuracao_inicial:
        titulo: "Doll"
        tagline: "Dólar, câmbio e o que isso muda no seu bolso"
        fuso: America/Sao_Paulo
        formato_data: "j \\d\\e F \\d\\e Y"
        formato_hora: "H:i"
        inicio_semana: 1
        limpar_exemplos: true       # manda 'Hello world!' e 'Sample Page' para a lixeira
        plugins:
          - seo-by-rank-math

    publicacao:
      calendario: auto
      radar: rascunho
      # Regra do piso (31/08/2026): SEMPRE sai post, obrigatoriamente — fim de
      # semana incluso. Depois da hora limite, se o dia ainda esta' zerado, a
      # esteira publica a nota-reserva do dia (100% da base propria).
      piso:
        minimo: 1        # posts/dia abaixo dos quais a reserva age
        apos_hora: 17    # hora de Sao Paulo a partir da qual o piso e' cobrado

  # ── Blogs Tihee (setembro/2026) ─────────────────────────────────────────
  # Sem base propria por enquanto: so' angulo editorial (o radar nao sugere
  # angulo de dado quando a base nao existe — ver README). Base propria de
  # cada um fica como evolucao (ex.: precos de ingredientes no broune,
  # tabua de defeso no pescaria, calendario IPVA/CNH no guiadomotorista).

  broune:
    dominio: broune.com.br
    entidade: "Broune — Receitas e Cozinha Prática"
    idioma: pt-BR
    fuso: America/Sao_Paulo

    # SO' RECEITAS (decisao de 18/09/2026): os hubs de economia da cozinha e
    # de alimentacao saudavel sairam. Preco de alimento e nutricao sao pauta
    # de noticia, nao de receita — e hub fora do tema puxa o classificador
    # para longe do que o site e'.
    hubs:
      - id: receitas-rapidas
        titulo: "Receitas rápidas e práticas"
        url: /receitas-rapidas
        termos: [receita, receitas, rapida, rápida, pratica, prática, facil, fácil, airfryer, air fryer, micro-ondas, 15 minutos, 30 minutos, poucos ingredientes]
        imagem: "quick home cooking"
      - id: doces-sobremesas
        titulo: "Doces e sobremesas"
        url: /doces-e-sobremesas
        termos: [bolo, bolos, torta, doce, doces, sobremesa, sobremesas, pudim, brigadeiro, mousse, cookie, biscoito, brownie, cheesecake]
        imagem: "homemade dessert cake"
      - id: pratos-principais
        titulo: "Pratos principais"
        url: /pratos-principais
        termos: [almoco, almoço, jantar, prato principal, carne, frango, peixe, massa, macarrao, macarrão, arroz, risoto, lasanha, sopa, ensopado]
        imagem: "home cooked main dish"
      - id: datas-festas
        titulo: "Receitas para datas e festas"
        url: /datas-e-festas
        termos: [natal, pascoa, páscoa, festa junina, ano novo, dia das maes, dia das mães, ceia, festa, comemoracao, comemoração]
        imagem: "festive holiday table food"

    fontes:
      - tipo: google_news
        consulta: "receitas para marmitas congeladas"
      # A segunda consulta e' de proposito MAIS ampla que a primeira: com as
      # duas iguais, so' chega pauta de marmita e os hubs de doces e de datas
      # nunca enchem. Editavel na aba Discovery do conteudo.tihee.
      - tipo: google_news
        consulta: "receita facil dia a dia"

    # Senha de APLICATIVO do WP (Usuarios -> Perfil -> Senhas de aplicativo).
    # Aqui vai so' o NOME da variavel; o valor fica no .env e nos secrets do
    # GitHub Actions.
    wordpress:
      url: https://broune.com.br
      usuario_env: WP_BROUNE_USUARIO
      senha_env: WP_BROUNE_SENHA
      categoria_por_hub: true

    publicacao:
      # auto (18/09/2026): a esteira destes blogs nao reescreve noticia — ela
      # escreve GUIA DE SERVICO sobre o tema que a pauta apontou como quente
      # (radar/gerador_artigo.py). Por isso o risco do README ("herdar o erro
      # de quem apurou") nao se aplica aqui: nao ha' apuracao de terceiro
      # sendo repetida. Voltar para 'rascunho' manda tudo como draft no WP.
      radar: auto

  divadabeleza:
    dominio: divadabeleza.com.br
