name: dolar-diario

on:
  schedule:
    # 17:10 UTC = 14:10 em Brasilia (UTC-3). A PTAX de fechamento sai por volta
    # das 13h10; a folga de uma hora cobre atraso do boletim.
    # Atencao ao horario de verao: se voltar a existir, revisar este cron.
    - cron: "10 17 * * 1-5"
  workflow_dispatch:

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m radar.dolar_diario
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WP_DOLL_USUARIO: ${{ secrets.WP_DOLL_USUARIO }}
          WP_DOLL_SENHA: ${{ secrets.WP_DOLL_SENHA }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artigos
          path: saida/
          if-no-files-found: ignore
