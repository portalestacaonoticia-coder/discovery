name: doll-diaria (dolar e ancoras)

on:
  schedule:
    # O GitHub atrasa cron de repo privado em ATE' HORAS (26/08: +2h; 27 e
    # 28/08: +8h). Tres tentativas com minuto impar aumentam a chance de uma
    # rodar cedo; o fluxo e' idempotente, entao rodar 3x nao duplica nada.
    # 17:16 UTC = 14:16 SP (PTAX de fechamento sai ~13h10 SP).
    # Atencao ao horario de verao: se voltar a existir, revisar estes crons.
    - cron: "16 17 * * 1-5"
    - cron: "46 18 * * 1-5"
    - cron: "26 20 * * 1-5"
  workflow_dispatch:

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m radar.dolar_diario
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WP_DOLL_USUARIO: ${{ secrets.WP_DOLL_USUARIO }}
          WP_DOLL_SENHA: ${{ secrets.WP_DOLL_SENHA }}
      # Os textos ancora (guias de servico) atualizam os numeros do dia na
      # mesma janela. if: always() — atualizam mesmo se o artigo do dia falhar,
      # porque sao paginas independentes.
      - run: python -m radar.ancoras
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WP_DOLL_USUARIO: ${{ secrets.WP_DOLL_USUARIO }}
          WP_DOLL_SENHA: ${{ secrets.WP_DOLL_SENHA }}
      # (Os satelites moraram aqui ate 28/08; foram para o radar.yml — rodam a
      # cada 30 min, todos os dias, respeitando o horario de cada pauta.)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artigos
          path: saida/
          if-no-files-found: ignore
