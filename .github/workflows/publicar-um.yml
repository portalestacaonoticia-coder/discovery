name: publicar (um site, DE VERDADE)

# Publica DE VERDADE, num site so'. E' o passo entre o ensaio e soltar o cron
# nos cinco: da' para ver o primeiro post no ar — com imagem destacada — antes
# de confiar na rodada automatica.
#
# Separado do radar.yml de proposito: workflow proprio, sem agendamento e com
# o site OBRIGATORIO no input. Nao existe clique que publique nos cinco sem
# querer.
#
# Actions -> "publicar (um site, DE VERDADE)" -> Run workflow -> escolher o site.

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site (id do config/sites.yaml)"
        required: true
        type: choice
        options:
          - broune
          - divadabeleza
          - cineartcafe
          - pescaria
          - guiadomotorista

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: confere o schema do banco
        run: python -m radar.verifica_schema
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: publica ${{ inputs.site }}
        run: python -m radar.publicar --site ${{ inputs.site }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WP_BROUNE_USUARIO: ${{ secrets.WP_BROUNE_USUARIO }}
          WP_BROUNE_SENHA: ${{ secrets.WP_BROUNE_SENHA }}
          WP_DIVADABELEZA_USUARIO: ${{ secrets.WP_DIVADABELEZA_USUARIO }}
          WP_DIVADABELEZA_SENHA: ${{ secrets.WP_DIVADABELEZA_SENHA }}
          WP_CINEARTCAFE_USUARIO: ${{ secrets.WP_CINEARTCAFE_USUARIO }}
          WP_CINEARTCAFE_SENHA: ${{ secrets.WP_CINEARTCAFE_SENHA }}
          WP_PESCARIA_USUARIO: ${{ secrets.WP_PESCARIA_USUARIO }}
          WP_PESCARIA_SENHA: ${{ secrets.WP_PESCARIA_SENHA }}
          WP_GUIADOMOTORISTA_USUARIO: ${{ secrets.WP_GUIADOMOTORISTA_USUARIO }}
          WP_GUIADOMOTORISTA_SENHA: ${{ secrets.WP_GUIADOMOTORISTA_SENHA }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artigos-${{ inputs.site }}
          path: saida/
          if-no-files-found: ignore
